# backend/supplier/.air.toml

root = "."
tmp_dir = "tmp"

[build]
# Arahkan ke folder cmd
cmd = "go build -o ./tmp/main ./cmd"
# Output binary hasil build
bin = "./tmp/main"
# Nama file log error build
log = "air_errors.log"
# Ekstensi file yang dipantau untuk trigger rebuild
include_ext = ["go", "tpl", "tmpl", "html", "env"]
# Folder yang diabaikan
exclude_dir = ["assets", "tmp", "vendor", "testdata", "docker"]
# Delay build (biar gak spam cpu usage)
delay = 1000 # ms
stop_on_error = true

[log]
time = true

[color]
main = "magenta"
watcher = "cyan"
build = "yellow"
runner = "green"

[misc]
clean_on_exit = true